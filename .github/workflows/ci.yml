name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go test -race ./...

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y brotli
      - run: ./scripts/build-wasm.sh
      - run: npm ci
      - run: npx vitest run packages/vitals-web/src/engine/
      - uses: actions/upload-artifact@v4
        with:
          name: vitals-web-assets
          path: packages/vitals-web/assets/

  # The pretest script of vitals-web rebuilds engine.wasm, so this job needs Go and brotli too; no artifact handoff.
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y brotli
      - run: npm ci
      # apps/demo resolves vitals-web through its dist/ (types for lint and typecheck, code for ng test).
      - run: npm run build --workspace packages/vitals-web
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  # Angular 22 needs Node >= 24.15. The demo unit tests run once, in the ts job (root npm test). The worker bundle needs vitals-web/dist, and the build copies the wasm and MediaPipe assets.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y brotli
      - run: npm ci
      - run: npm run build:wasm --workspace packages/vitals-web
      - run: npm run build --workspace packages/vitals-web
      - run: ./scripts/fetch-assets.sh
      - run: npm run build --workspace apps/demo

  # Real Chromium with a fake camera (no face): consent, camera, worker, engine and UI end to end, plus the mock flow.
  e2e:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y brotli
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:wasm --workspace packages/vitals-web
      - run: ./scripts/fetch-assets.sh
      - run: npm run build --workspace packages/vitals-web
      - run: npm run build --workspace apps/demo
      - run: node scripts/make-fake-video.mjs
      - run: npx playwright test --config apps/demo/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/demo/test-results/
